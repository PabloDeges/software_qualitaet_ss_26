# ─────────────────────────────────────────────────────────────────────────────
#  .github/workflows/ci-cd.yml  –  software_qualitaet_ss_26
#  Runs on every push / PR to main.
#  Jobs:
#    test-mqtt      → Maven test  (mqtt-project, with MongoDB sidecar)
#    test-rest-api  → Maven test  (rest-api,     with MongoDB sidecar)
#    test-frontend  → npm ci + vite build
#    build-push     → Docker build & push all 3 images to ghcr.io   (main only)
#    deploy         → SSH pull + docker compose up                   (main only)
# ─────────────────────────────────────────────────────────────────────────────

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:     ghcr.io
  IMAGE_MQTT:   ghcr.io/${{ github.repository_owner }}/mqtt-project
  IMAGE_REST:   ghcr.io/${{ github.repository_owner }}/rest-api
  IMAGE_FRONT:  ghcr.io/${{ github.repository_owner }}/frontend

jobs:

  # ── Test: mqtt-project ──────────────────────────────────────────────────────
  test-mqtt:
    name: Test mqtt-project
    runs-on: ubuntu-latest

    # Spin up a real MongoDB so the Spring Data tests can talk to it
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: mqtt-project
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/testdb
          MQTT_BROKER:    tcp://localhost:1883
          MQTT_USERNAME:  test
          MQTT_PASSWORD:  test
          MQTT_CLIENT_ID: test-mqtt-gh
        run: mvn -B test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-test-results
          path: mqtt-project/target/surefire-reports/

  # ── Test: rest-api ──────────────────────────────────────────────────────────
  test-rest-api:
    name: Test rest-api
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: rest-api
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/testdb
          MQTT_BROKER:    tcp://localhost:1883
          MQTT_USERNAME:  test
          MQTT_PASSWORD:  test
          MQTT_CLIENT_ID: test-rest-gh
        run: mvn -B test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-api-test-results
          path: rest-api/target/surefire-reports/

  # ── Test: frontend ──────────────────────────────────────────────────────────
  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (Vite)
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── Docker build & push (main branch only) ──────────────────────────────────
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [test-mqtt, test-rest-api, test-frontend]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write        # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Short SHA used as an immutable tag alongside :latest
      - name: Resolve short SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Build & push all 3 in parallel (docker/build-push-action v5 is async-safe)
      - name: Build & push mqtt-project
        uses: docker/build-push-action@v5
        with:
          context: ./mqtt-project
          push: true
          tags: |
            ${{ env.IMAGE_MQTT }}:latest
            ${{ env.IMAGE_MQTT }}:${{ steps.meta.outputs.sha }}

      - name: Build & push rest-api
        uses: docker/build-push-action@v5
        with:
          context: ./rest-api
          push: true
          tags: |
            ${{ env.IMAGE_REST }}:latest
            ${{ env.IMAGE_REST }}:${{ steps.meta.outputs.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONT }}:latest
            ${{ env.IMAGE_FRONT }}:${{ steps.meta.outputs.sha }}

  # ── Deploy to server (main branch only) ─────────────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'

    environment: production     # shows a "production" badge on the Actions page

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Authenticate against ghcr.io on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker pull ${{ env.IMAGE_MQTT }}:latest
            docker pull ${{ env.IMAGE_REST }}:latest
            docker pull ${{ env.IMAGE_FRONT }}:latest

            # Rolling restart – only recreates containers whose image changed
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose up -d --remove-orphans

            # Prune dangling images to reclaim disk
            docker image prune -f
